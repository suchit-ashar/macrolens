name: Daily data ingestion

on:
  schedule:
    - cron: "30 1 * * *"    # 01:30 UTC = 07:00 IST, every day
  workflow_dispatch:         # adds a "Run workflow" button for manual runs

permissions:
  contents: write            # to commit updated data
  issues: write              # to open an issue when a fetch fails

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      # Keep downloaded source files (RBI releases, FBIL workbooks, Budget/CGA pages) between runs,
      # so each day only new releases are downloaded. Parquet in data/clean stays the source of truth.
      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Fetch data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          status=0
          python -m ingest.run_all || status=$?
          # Show the run report on the run's summary page as well.
          { echo '```'; cat data/logs/last_run.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Commit updated data
        if: always()
        run: |
          git config user.name "macrolens-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/clean/*.parquet data/logs/last_run.txt || true
          git diff --cached --quiet || git commit -m "Data update $(date -u +%Y-%m-%d)"
          git push

      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --title "Ingestion failure $(date -u +%Y-%m-%d)" \
            --body "Run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
