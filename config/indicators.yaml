  source_url: https://www.imf.org/en/Publications/WEO

- id: in_gov_primary_balance_gdp
  country: IN
  topic: fiscal
  name: India general government primary balance, % of GDP (IMF WEO)
  source: IMF
  source_series: "WEO:IND.GGXONLB_NGDP.A"
  unit: percent_of_gdp
  frequency: annual
  note: Fiscal balance excluding interest payments.
  source_url: https://www.imf.org/en/Publications/WEO

- id: us_gov_debt_gdp
