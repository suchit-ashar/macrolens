# ============================== FISCAL ==============================
# IMF World Economic Outlook via the IMF SDMX API (latest WEO, no key). General government =
# centre + states. History/estimates (before the current year) and IMF projections (current
# year onwards) are separate ids and never mixed. India figures are fiscal years (2025 = FY26).
- id: in_gov_debt_gdp
  country: IN
  topic: fiscal
  name: India general government gross debt, % of GDP (IMF WEO)
  source: IMF
  source_series: "WEO:IND.GGXWDG_NGDP.A"
  unit: percent_of_gdp
  frequency: annual
  note: Centre + States, fiscal years. FRBM target for general government is 60% of GDP. Latest years are IMF estimates.
  source_url: https://www.imf.org/en/Publications/WEO

- id: in_gov_debt_gdp_proj
  country: IN
  topic: fiscal
  name: India general government gross debt, % of GDP (IMF projection)
  source: IMF
  source_series: "WEO:IND.GGXWDG_NGDP.A:proj"
  unit: percent_of_gdp
  frequency: annual
  projection: true
  note: IMF projection, not actual data.
  source_url: https://www.imf.org/en/Publications/WEO

- id: in_gov_balance_gdp
  country: IN
  topic: fiscal
  name: India general government fiscal balance, % of GDP (IMF WEO)
  source: IMF
  source_series: "WEO:IND.GGXCNL_NGDP.A"
  unit: percent_of_gdp
  frequency: annual
  note: Net lending (+) / borrowing (-); negative = deficit. Centre + States, so larger than the Union fiscal deficit.
  source_url: https://www.imf.org/en/Publications/WEO

- id: in_gov_balance_gdp_proj
  country: IN
  topic: fiscal
  name: India general government fiscal balance, % of GDP (IMF projection)
  source: IMF
  source_series: "WEO:IND.GGXCNL_NGDP.A:proj"
  unit: percent_of_gdp
  frequency: annual
  projection: true
