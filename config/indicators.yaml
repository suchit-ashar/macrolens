# Indicator registry. Every series the app shows must be listed here, and every one is fetched
# automatically by ingest/run_all.py (no manual data entry).
#
# Required: id, country, name, source, source_series, unit, frequency, source_url
# Optional: topic (dashboard grouping: monetary, inflation, growth, labour, fiscal, markets)
#           known_gaps: [dates ending a gap the source never filled]     (quality checks)
#           expect_updates: false   closed historical series            (quality checks)
#           stale_after_days: N     override the staleness limit        (quality checks)
#           note: shown under the chart

# ============================== MONETARY ==============================
# RBI rates: history 2008-2025 imported once from RBI Handbook Table 40 (ingest/rbi_history.py);
# afterwards read daily from the RBI home page. A row is stored only when the rate changes.
# Repo/SDF/MSF/Bank Rate are dated from the MPC press release automatically.
- id: in_repo_rate
  country: IN
  topic: monetary
  name: RBI policy repo rate
  source: RBI
  source_series: "homepage:Policy Repo Rate"
  unit: percent
  frequency: event
  source_url: https://www.rbi.org.in/

- id: in_sdf_rate
  country: IN
  topic: monetary
  name: Standing Deposit Facility rate (floor of the corridor)
  source: RBI
  source_series: "homepage:Standing Deposit Facility Rate"
  unit: percent
  frequency: event
  note: Introduced 8 April 2022; replaced the fixed reverse repo as the corridor floor.
  source_url: https://www.rbi.org.in/

- id: in_msf_rate
  country: IN
  topic: monetary
  name: Marginal Standing Facility rate (ceiling of the corridor)
  source: RBI
  source_series: "homepage:Marginal Standing Facility Rate"
  unit: percent
  frequency: event
  source_url: https://www.rbi.org.in/

- id: in_bank_rate
  country: IN
  topic: monetary
  name: RBI Bank Rate
  source: RBI
  source_series: "homepage:Bank Rate"
  unit: percent
  frequency: event
  source_url: https://www.rbi.org.in/

- id: in_crr
  country: IN
  topic: monetary
  name: Cash Reserve Ratio (CRR)
  source: RBI
  source_series: "homepage:CRR"
  unit: percent
  frequency: event
  source_url: https://www.rbi.org.in/

- id: in_slr
  country: IN
  topic: monetary
  name: Statutory Liquidity Ratio (SLR)
  source: RBI
  source_series: "homepage:SLR"
  unit: percent
  frequency: event
  source_url: https://www.rbi.org.in/

- id: us_policy_rate
  country: US
  topic: monetary
  name: Fed funds target range, upper bound
  source: FRED
  source_series: DFEDTARU
  unit: percent
  frequency: daily
  source_url: https://fred.stlouisfed.org/series/DFEDTARU

- id: us_fed_funds_effective
  country: US
  topic: monetary
  name: Federal funds effective rate
  source: FRED
  source_series: DFF
  unit: percent
  frequency: daily
  source_url: https://fred.stlouisfed.org/series/DFF

# ============================== INFLATION ==============================
# India CPI, 2024 base. state 1 = All India, sector 3 = Combined, division 0 = CPI (General),
# division 1 = Food and beverages. "inflation" is MoSPI's own published YoY %.
# Live series (2025 onwards) and MoSPI's official back series are separate ids, never spliced.
- id: in_cpi_inflation
  country: IN
  topic: inflation
  name: CPI headline inflation, YoY % (2024 base, official)
  source: MoSPI
  source_series: "cpi/getCPIData?base_year=2024&series=Current&state_code=1&sector_code=3&division_code=0&_value=inflation"
  unit: percent
  frequency: monthly
  note: RBI's target is 4% with a tolerance band of 2-6%.
  source_url: https://esankhyiki.mospi.gov.in/macroindicators?product=cpi

- id: in_cpi_inflation_back
  country: IN
  topic: inflation
  name: CPI headline inflation, YoY % (2024 base, official back series)
  source: MoSPI
  source_series: "cpi/getCPIData?base_year=2024&series=Back&state_code=1&sector_code=3&division_code=0&_value=inflation"
  unit: percent
  frequency: monthly
  expect_updates: false
  source_url: https://esankhyiki.mospi.gov.in/macroindicators?product=cpi

- id: in_food_inflation
  country: IN
  topic: inflation
  name: CPI food and beverages inflation, YoY % (2024 base, official)
  source: MoSPI
  source_series: "cpi/getCPIData?base_year=2024&series=Current&state_code=1&sector_code=3&division_code=1&_value=inflation&_top=group&_from_year=2025"
  unit: percent
  frequency: monthly
  note: Food and beverages carry about 37% of the 2024-base CPI basket.
  source_url: https://esankhyiki.mospi.gov.in/macroindicators?product=cpi

- id: in_cpi_2024base
  country: IN
  topic: inflation
  name: All-India CPI combined, general index (base 2024=100)
  source: MoSPI
  source_series: "cpi/getCPIData?base_year=2024&series=Current&state_code=1&sector_code=3&division_code=0"
  unit: index
  frequency: monthly
  source_url: https://esankhyiki.mospi.gov.in/macroindicators?product=cpi

- id: in_cpi_2024base_back
  country: IN
  topic: inflation
  name: All-India CPI combined, general index (base 2024=100), official back series
  source: MoSPI
  source_series: "cpi/getCPIData?base_year=2024&series=Back&state_code=1&sector_code=3&division_code=0"
  unit: index
  frequency: monthly
  expect_updates: false   # closed historical series: skip the staleness check
  source_url: https://esankhyiki.mospi.gov.in/macroindicators?product=cpi

- id: us_cpi
  country: US
  topic: inflation
  name: CPI-U, all items, seasonally adjusted
  source: FRED
  source_series: CPIAUCSL
  unit: index
  frequency: monthly
  known_gaps: ["2025-11-01"]   # BLS published no October 2025 CPI (federal government shutdown)
  source_url: https://fred.stlouisfed.org/series/CPIAUCSL

- id: us_core_cpi
  country: US
  topic: inflation
  name: CPI-U less food and energy (core), seasonally adjusted
  source: FRED
  source_series: CPILFESL
  unit: index
  frequency: monthly
  known_gaps: ["2025-11-01"]
  source_url: https://fred.stlouisfed.org/series/CPILFESL

- id: us_core_pce
  country: US
  topic: inflation
  name: US core PCE price index (the Fed's 2% target measure)
  source: FRED
  source_series: PCEPILFE
  unit: index
  frequency: monthly
  known_gaps: ["2025-11-01"]
  source_url: https://fred.stlouisfed.org/series/PCEPILFE

